<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#145A46">
  <meta name="description" content="Personal health journey tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
  <title>My Health Journey</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PERSONAL HEALTH</div>
      <h1 id="pageTitle">My Health Journey</h1>
    </div>
    <button class="icon-btn" id="installBtn" hidden aria-label="Install app">⇩</button>
  </header>

  <main id="app" class="app"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-tab="home" class="nav-item active"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><small>Home</small></button>
    <button data-tab="health" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.2-8.8 11-8.8 11s-8.8-5.8-8.8-11A4.8 4.8 0 0 1 12 6.1a4.8 4.8 0 0 1 8.8 2.7Z"/><path d="M3.5 12h4l2-4 3.2 8 2.1-4h5.7"/></svg></span><small>Health</small></button>
    <button data-tab="log" class="nav-item add"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><small>Log</small></button>
    <button data-tab="insights" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 5-7"/><circle cx="19" cy="6" r="1"/></svg></span><small>Insights</small></button>
    <button data-tab="more" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span><small>More</small></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
