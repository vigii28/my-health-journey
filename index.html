<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#145A46">
  <meta name="description" content="Personal health journey tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="styles.css">
  <title>My Health Journey</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">PERSONAL HEALTH</div>
      <h1 id="pageTitle">My Health Journey</h1>
    </div>
    <button class="icon-btn" id="installBtn" hidden aria-label="Install app">⇩</button>
  </header>

  <main id="app" class="app"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-tab="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
    <button data-tab="health" class="nav-item"><span>♥</span><small>Health</small></button>
    <button data-tab="log" class="nav-item add"><span>＋</span><small>Log</small></button>
    <button data-tab="insights" class="nav-item"><span>⌁</span><small>Insights</small></button>
    <button data-tab="more" class="nav-item"><span>•••</span><small>More</small></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
